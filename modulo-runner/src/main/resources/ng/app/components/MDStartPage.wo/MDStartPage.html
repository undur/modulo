<wo:MDLook>
	<div class="row">
		<div class="col-lg-4 col-md-6 col-sm-12">
			<div class="card mb-3">
				<div class="card-header">
					<h3>🤖 Modulo</h3>
				</div>
				<table class="table table-sm mb-0">
					<tr><td>Started</td><td><wo:str value="$started" /></td></tr>
					<tr><td>Plain proxy port</td><td><wo:str value="$proxyPort" /></td></tr>
					<tr><td>Front-end</td><td><wo:str value="$frontendStatus" /></td></tr>
					<tr><td>Adaptor</td><td><wo:str value="$applicationCount" /></td></tr>
				</table>
			</div>
		</div>
		<div class="col-lg-4 col-md-6 col-sm-12">
			<div class="card mb-3">
				<div class="card-header">
					<h3>Response times — last hour</h3>
				</div>
				<wo:if condition="$hasTraffic" negate="true">
					<div class="card-body text-secondary">No proxied traffic in the window yet.</div>
				</wo:if>
				<wo:if condition="$hasTraffic">
					<table class="table table-sm mb-0">
						<thead>
							<tr><th>Application</th><th>Requests</th><th>Avg response</th></tr>
						</thead>
						<wo:repetition list="$appTotals" item="$currentTotal">
							<tr>
								<td><wo:str value="$currentTotal.applicationName" /></td>
								<td><wo:str value="$currentTotal.requests" /></td>
								<td><wo:str value="$currentTotal.averageResponseMs" />ms</td>
							</tr>
						</wo:repetition>
					</table>
				</wo:if>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-12">
			<div class="card mb-3">
				<div class="card-header">
					<h3>Requests per minute, by application — last hour</h3>
				</div>
				<div class="card-body">
					<div id="traffic-chart" style="height: 300px;"></div>
				</div>
			</div>
		</div>
	</div>
	<wo:script filename="echarts/echarts.min.js" />
	<script>
		fetch('/stats.json')
			.then(function(r) { return r.json(); })
			.then(function(data) {
				var apps = Object.keys(data.requestSeries);
				var chart = echarts.init(document.getElementById('traffic-chart'));
				chart.setOption({
					tooltip: { trigger: 'axis' },
					legend: { data: apps },
					grid: { left: 40, right: 16, top: 32, bottom: 24 },
					xAxis: { type: 'category', boundaryGap: false, data: data.minuteLabels },
					yAxis: { type: 'value', minInterval: 1 },
					series: apps.map(function(app) {
						return {
							name: app,
							type: 'line',
							stack: 'requests',
							areaStyle: {},
							showSymbol: false,
							emphasis: { focus: 'series' },
							data: data.requestSeries[app]
						};
					})
				});
				window.addEventListener('resize', function() { chart.resize(); });
			});
	</script>
</wo:MDLook>
