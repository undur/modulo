<wo:MDLook>
	<div class="row">
		<div class="col-lg-6 col-md-10 col-sm-12">
			<div class="card">
				<div class="card-header">
					<h3>🤖 Modulo</h3>
				</div>
				<table class="table table-sm mb-0">
					<tr><td>Started</td><td><wo:str value="$started" /></td></tr>
					<tr><td>Plain proxy port</td><td><wo:str value="$proxyPort" /></td></tr>
					<tr><td>Front-end</td><td><wo:str value="$frontendStatus" /></td></tr>
					<tr><td>Adaptor</td><td><wo:str value="$applicationCount" /></td></tr>
				</table>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-12">
			<div class="card mb-3">
				<div class="card-header">
					<h3>Configuration</h3>
					<div class="card-subtitle">Every value the server runs with — including the currently unmodifiable "sensible defaults". "Configurable: not yet" doubles as the to-do list for the config surface.</div>
				</div>
				<table class="table table-sm mb-0">
					<thead>
						<tr>
							<th>Setting</th>
							<th>Value</th>
							<th>Source</th>
							<th>Configurable</th>
						</tr>
					</thead>
					<wo:repetition list="$settingGroups" item="$currentGroup">
						<tr class="table-active">
							<th colspan="4"><wo:str value="$currentGroup.name" /></th>
						</tr>
						<wo:repetition list="$currentGroup.rows" item="$currentSetting">
							<tr>
								<td><wo:str value="$currentSetting.name" /></td>
								<td><code><wo:str value="$currentSetting.value" /></code></td>
								<td class="text-secondary"><wo:str value="$currentSetting.source" /></td>
								<td><wo:str value="$currentSetting.configurable" /></td>
							</tr>
						</wo:repetition>
					</wo:repetition>
				</table>
			</div>
		</div>
	</div>
</wo:MDLook>
